# Suivi des congés — backend (API Flask/gunicorn) + frontend (nginx : fichiers statiques + relais /api).
#
#   cp .env.example .env     # puis renseigner CONGES_SECRET_KEY, POSTGRES_*, APM_API_KEY…
#   docker-compose up -d --build
#
# Ports : backend 8110, frontend (réseau interne) 8111, frontend DMZ 8112 (docker-compose.dmz.yml).
# Le backend est publié sur 8110 pour que le futur frontend de la DMZ puisse le joindre : à limiter par
# pare-feu à l'adresse du frontend DMZ (BACK_BIND=127.0.0.1 tant qu'il n'y a pas de frontend distant).
# Le HTTPS est assuré par le reverse-proxy de la Ville devant les frontends.
services:
  backend:
    build:
      context: ./backend
    restart: always
    env_file: .env
    environment:
      - CONGES_SECRET_KEY=${CONGES_SECRET_KEY:?Définir CONGES_SECRET_KEY dans .env}
      # 1 = nginx seul devant l'application ; 2 si le reverse-proxy de la Ville s'ajoute devant nginx.
      - CONGES_PROXY_HOPS=${CONGES_PROXY_HOPS:-1}
      - CONGES_COOKIE_SECURE=${CONGES_COOKIE_SECURE:-1}
    volumes:
      - conges_data:/data
    ports:
      - "${BACK_BIND:-127.0.0.1}:${BACK_PORT:-8110}:8110"

  frontend:
    build:
      context: ./frontend
    restart: always
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://backend:8110}
    ports:
      - "${FRONT_PORT:-8111}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  conges_data:
